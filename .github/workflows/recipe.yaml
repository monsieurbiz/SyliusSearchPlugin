name: Flex Recipe

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: bourtitom/symfony-recipes
          # Exact companion PR #20 content; switch to upstream after that recipe is merged.
          ref: 09355e1c678922f04ea61fd5d8bda276ec542fb4
          path: symfony-recipes
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl
      - name: Serve the unpublished companion recipe
        working-directory: plugin
        run: |
          make recipe.endpoint
          php -S 127.0.0.1:8088 -t tests/RecipeEndpoint >/tmp/search-recipe-server.log 2>&1 &
      - name: Create an independent consumer (no dist overlay)
        working-directory: plugin
        run: composer create-project --no-interaction --no-install --no-scripts --no-plugins sylius/sylius-standard:~2.2.0 tests/Application
      - name: Install the local recipe with Flex
        working-directory: plugin/tests/Application
        run: |
          composer config repositories.plugin '{"type":"path","url":"../../","options":{"versions":{"monsieurbiz/sylius-search-plugin":"3.0.0"}}}'
          composer config extra.symfony.docker false
          # Only this disposable consumer allows HTTP, exclusively for the loopback recipe server.
          composer config secure-http false
          composer config --json extra.symfony.endpoint '["http://127.0.0.1:8088/index.json","https://api.github.com/repos/Sylius/SyliusRecipes/contents/index.json?ref=flex/main","https://api.github.com/repos/monsieurbiz/symfony-recipes/contents/index.json?ref=flex/master","flex://defaults"]'
          composer require monsieurbiz/sylius-search-plugin:3.0.0 --no-interaction --no-scripts
          php bin/console lint:container
          php -r '$lock=json_decode(file_get_contents("symfony.lock"), true, 512, JSON_THROW_ON_ERROR); if (($lock["monsieurbiz/sylius-search-plugin"]["recipe"]["version"] ?? null) !== "3.0") { exit(1); }'
